living_community:
  intro:
  - The Americans with Disabilities Act (ADA) rests on the principle that people with
    disabilities have the right to live in the community, with the supports they need,
    rather than in an institution. The U.S. Supreme Court affirmed that right in the
    landmark <em>Olmstead</em> decision in 1999, holding that unnecessary institutionalization
    is a form of discrimination.<sup>1</sup>
  - This fact sheet shows how many people with disabilities are living in the community
    in each state. Community living covers two situations. Most people live <strong>at
    home</strong>, alone or with family. A smaller number live in <strong>non-institutional
    group quarters</strong>, a Census Bureau category for group settings that are
    not institutions, such as group homes, shelters and college dormitories.<sup>2</sup>
  - Nationally, <strong>95.5 percent</strong> of people with disabilities live in
    the community, compared with <strong>99.5 percent</strong> of people without disabilities.
    The maps and tables below show how much that figure varies from state to state.
  - Higher percentages mean more people with disabilities are living in the community.
    The residence categories on this sheet and on its companion, <em>Living in Institution</em>,
    are measured against the same population and add to 100 percent. Every percentage
    point not living in the community is a percentage point living in an institution.
  community_combined_lead: The map below combines both community settings, people
    living at home and people living in non-institutional group quarters, into a single
    measure. States shaded darker have a larger share of their disabled residents
    living in the community.
  home_lead: Living at home means living in a house or apartment, alone, with family
    or with roommates, rather than in any kind of group setting. This is by far the
    most common living arrangement for people with disabilities, and it is the measure
    most directly tied to the independent living the ADA envisions.
  nonintgq_lead:
  - Non-institutional group quarters is a Census Bureau category covering group living
    arrangements that are not institutions. It includes group homes and supported
    living for people with disabilities, but also emergency shelters, transitional
    housing and college dormitories.
  - Because the category mixes supported community living with housing instability,
    a higher percentage is not straightforwardly better or worse. This map is therefore
    shaded by how large the share is rather than by performance, and its groups are
    labeled by size rather than as Excellent or Poor. Read it alongside the other
    two measures rather than on its own.
  footnotes:
  - '<em>Olmstead v. L.C.</em>, 527 U.S. 581 (1999). See also Office for Civil Rights.
    (2018, June 28). <em>Serving people with disabilities in the most integrated setting:
    Community living and Olmstead.</em> U.S. Department of Health and Human Services.'
  - U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Tables ACSST5Y{acs_year}.S2601A and ACSDT5Y{acs_year}.B26108. All percentages
    on this sheet are calculated against the total population with a disability, including
    people living in institutions.
living_institution:
  intro:
  - The Americans with Disabilities Act (ADA) mandates the right to live in the community
    with supports instead of living in a nursing home or other institution. The U.S.
    Supreme Court upheld this right in the landmark <em>Olmstead</em> decision in
    1999.<sup>1</sup>
  - Despite that right, people with disabilities remain far more likely than other
    people to live in an institution. Nationally, <strong>4.6 percent</strong> of
    people with disabilities live in an institutional setting, compared with <strong>0.5
    percent</strong> of people without disabilities. People with disabilities are
    <strong>more than eight times</strong> as likely to be institutionalized.
  - The Census Bureau counts three kinds of institutional settings in these data.
    <strong>Nursing homes and other medical facilities</strong> account for the largest
    share, followed by <strong>adult correctional facilities</strong>. A small remainder
    covers settings such as psychiatric hospitals and juvenile facilities.<sup>2</sup>
  - Lower percentages mean fewer people with disabilities are institutionalized and
    more are living in the community. Some states do considerably better than others.
    Where a person lives continues to shape whether they are supported at home or
    placed in an institution.
  inst_combined_lead: This map combines every institutional setting into one measure,
    the share of people with disabilities living in an institution rather than in
    the community. It is the exact complement of the combined measure on the companion
    sheet, <em>Living in Community</em>.
  nursing_lead: Nursing homes and other long-term medical facilities are the most
    common institutional setting for people with disabilities. This measure covers
    residents of all ages. Rates broken out by age group appear in the supplementary
    table further down.
  corrections_lead: Adult correctional facilities are the second largest institutional
    setting for people with disabilities, encompassing prisons, jails and other correctional
    group quarters as classified in the Census Bureau&rsquo;s group quarters data.
    People with disabilities are over-represented in these settings relative to their
    share of the general population, a pattern that reflects gaps in community mental
    health services, housing and support as much as anything about the criminal legal
    system itself.
  nursing_by_age_lead: The table below breaks nursing home residence into two age
    groups. <strong>These figures use different denominators from the maps above.</strong>
    The working-age rate is calculated against the population with a disability aged
    18 to 64, and the rate for older adults against the population with a disability
    aged 65 and over. They describe the risk within each age group. They cannot be
    added together, and they cannot be compared against the all-ages figures on the
    maps.
  footnotes:
  - 'Office for Civil Rights. (2018, June 28). <em>Serving people with disabilities
    in the most integrated setting: Community living and Olmstead.</em> U.S. Department
    of Health and Human Services.'
  - U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Tables ACSST5Y{acs_year}.S2601A, ACSST5Y{acs_year}.S2602 and ACSDT5Y{acs_year}.B26108.
    The institutional total is derived as the total population with a disability less
    those living at home and those living in non-institutional group quarters.
housing:
  intro:
  - The Americans with Disabilities Act (ADA) mandates the right to live in the community
    with supports for people with disabilities instead of living in a nursing home.
    Similarly, the Fair Housing Act (FHA) expands on this right by prohibiting discrimination
    against people with disabilities by landlords and other housing providers. Despite
    this right to live in the community, people with disabilities face many difficulties
    in finding affordable and accessible housing.
  - Finding and securing housing is a challenge for people with disabilities, as they
    are far more likely to live in poverty than their non-disabled peers. Additionally,
    despite protections from the ADA and FHA, people with disabilities still face
    a great amount of discrimination from landlords. Supports such as the Section
    8 Housing Choice Voucher program (HCV) and public housing are meant to alleviate
    these difficulties.<sup>1</sup>
  - Some states are doing better than others to ensure access to HCVs and public housing
    for people with disabilities. To honor the ADA and its mandates of inclusion,
    states must work to increase the representation of people with disabilities in
    their housing support, especially the Housing Choice Voucher program, which provides
    the greatest access to integrated community living.
  footnotes: U.S. Department of Housing and Urban Development (HUD), PD&amp;R, <em>A
    Picture of Subsidized Households (PSH)</em>, state totals (Summary Level 3), Public
    Housing (program=2) and Housing Choice Vouchers (program=3).
hcbs:
  intro:
  - The Americans with Disabilities Act (ADA) mandates the right to live in the community
    with supports instead of living in a nursing home or long-term care institution.
    This right was upheld by the U.S. Supreme Court in the landmark <em>Olmstead</em>
    decision in 1999.<sup>1</sup>
  - Despite this right to live in the community, some states invest more than others
    in each person they serve. The map and tables below display <strong>state Medicaid
    spending per recipient on home- and community-based services (HCBS)</strong>,
    inclusive of all waiver types (Community First Choice, Section 1915(i), Section
    1915(c), Section 1515), for people with disabilities (all ages) living in the
    community. This is the total HCBS expenditure divided by the number of people
    receiving HCBS.<sup>2</sup>
  - Lower spending per recipient means fewer financial resources reaching each person
    with a disability who relies on community services. Higher spending per recipient
    means stronger financial support for each person's community living. This measure
    reflects how generously a state supports each recipient, not how many people it
    reaches. Rebalancing money toward community living remains an ADA-related disparity
    issue for many people with disabilities, putting them at higher risk for institutionalization.
    Currently, this community living support is highly dependent on the zip code and
    state in which you live.
  ratio_lead: Spending per recipient shows how much reaches each person, but not how
    a state divides its long-term care budget between community and institutional
    settings. This second measure shows <strong>the share of each state&rsquo;s Medicaid
    long-term services and supports (LTSS) spending that goes to home- and community-based
    services (HCBS) rather than to institutions</strong> such as nursing facilities
    and intermediate care facilities. A higher share means a state directs more of
    its long-term care dollars toward community living. A lower share means more of
    its dollars go to institutional care.<sup>3</sup>
  about:
    title: About These Data
    body: The information shown on this website comes from research conducted by <strong>Mathematica</strong>.
      We did not collect or create the original data. We organized and presented the
      information to make it easier for community members, including people with disabilities,
      to understand and compare. All credit for the original research, data collection,
      and analysis belongs to Mathematica and the report&rsquo;s authors. Any changes
      we made were limited to how the information is displayed and did not alter the
      original data.
  footnotes:
  - 'Office for Civil Rights. (2018, June 28). <em>Serving people with disabilities
    in the most integrated setting: Community living and Olmstead.</em> U.S. Department
    of Health and Human Services.'
  - Mathematica, prepared for the Centers for Medicare &amp; Medicaid Services (CMS).
    <em>Medicaid LTSS Users &amp; Expenditures, {source_year} Data Tables</em> (T-MSIS
    Analytic Files). Spending per recipient = total HCBS expenditure (A2_LTSSExpDlvrySystm_{source_year}.xlsx,
    tab &ldquo;A.2.3 All-HCBS&rdquo;, column &ldquo;HCBS (total)&rdquo;) divided by
    HCBS recipients (A1_LTSSUsrDlvrySystm_{source_year}.xlsx, tab &ldquo;A.1.3 All-HCBS&rdquo;,
    column &ldquo;HCBS (total)&rdquo;); both inclusive of fee-for-service and managed
    care. Subpopulation context from C1_LTSSUsrChar_{source_year}.xlsx, tab &ldquo;C.1.21
    HCBSBySubpop.&rdquo; See CMS LTSS Reports &amp; Evaluations.
  - Carpenter, A., Stepanczuk, C., Murray, C., &amp; Wysocki, A. (2025, October 17).
    <em>Trends in users and expenditures for home and community-based services as
    a share of total Medicaid long-term services and supports users and expenditures,
    2023.</em> Mathematica. <a href="https://www.medicaid.gov/medicaid/long-term-services-supports/downloads/ltss-rebalancing-brief-2023.pdf"
    target="_blank" rel="noopener noreferrer">Report PDF</a>. Community share of LTSS
    spending = HCBS expenditure (tab &ldquo;A.2.3 All-HCBS,&rdquo; column &ldquo;HCBS
    (total)&rdquo;) divided by the sum of HCBS and institutional expenditure (tab
    &ldquo;A.2.2 All-Inst,&rdquo; column &ldquo;Institutional (total)&rdquo;) from
    A2_LTSSExpDlvrySystm_{source_year}.xlsx. Because LTSS equals HCBS plus institutional
    spending, this equals HCBS as a share of total Medicaid LTSS expenditure.
poverty:
  intro:
  - The Americans with Disabilities Act (ADA) rests on the idea that people with disabilities
    should be assured equal opportunity and economic self-sufficiency.<sup>1</sup>
    More than three decades on, a person with a disability is still close to twice
    as likely to be living below the poverty line.
  - Nationally, <strong>{pov_dis_all} percent</strong> of people with disabilities
    live below the poverty line, against <strong>{pov_nod_all} percent</strong> of
    people without disabilities. That is {pov_count_dis} people. The gap holds at
    every age, and it is widest during working life.<sup>2</sup>
  - Poverty and disability compound each other. Disability raises the cost of an ordinary
    life, through medical care, personal assistance, accessible housing and transport,
    while narrowing access to the work that would pay for it. That shows up in who
    is poor. People with disabilities are <strong>{pov_share_of_pop} percent</strong>
    of the people counted here, but <strong>{pov_share_of_poor} percent</strong> of
    everyone living below the poverty line.
  - This sheet reports the share of people living below the poverty line, first for
    everyone and then for three age groups. Lower percentages are better. All four
    measures are drawn from the same population, the people the Census Bureau assesses
    for poverty, so the three age groups add to the all-ages figure exactly.<sup>2</sup>
  allages_lead: The two maps below are the headline measure, the share of people of
    any age living below the poverty line, shown for people with disabilities and
    for people without. Each map ranks states against the other states on that map,
    so a shade says where a state stands among states rather than how the two groups
    compare. The comparison is in the ranges printed under each map. Every tier on
    the right sits at a lower rate than the tier of the same name on the left, and
    that distance is the disparity this sheet is about.
  under18_lead: Children with a disability are poorer than children without one, though
    this is the narrowest of the three age gaps. Child poverty is mostly a measure
    of the household a child lives in rather than of the child, so this map reflects
    family income and the added cost of raising a disabled child at the same time.
  age1864_lead: Working age is where the gap is widest. A working-age adult with a
    disability is {pov_ratio_1864} times as likely to be below the poverty line as
    one without. This was the only measure on this sheet until August 2026, and it
    is the one tied most directly to the barriers described on the companion Employment
    sheet.
  age65plus_lead: Poverty falls after 65 for both groups, because Social Security
    and Medicare reach almost everyone. The disability gap narrows but does not close.
    Read this map beside the other two rather than on its own, since a low rate here
    reflects federal income support more than anything a state has done.
  footnotes:
  - Americans With Disabilities Act of 1990. Pub. L. 101-336. &sect; 1. 26 July 1990.
    104 Stat. 328.
  - 'U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Table ACSDT5Y{acs_year}.C18130, Age by Disability Status by Poverty Status. Universe:
    the population for whom poverty status is determined, which excludes people living
    in group quarters, including institutions and college dormitories, and unrelated
    individuals under 15. Each rate is the count below the poverty line divided by
    that same universe for the same age group and disability status, so numerator
    and denominator are drawn from one table. The all-ages figure is the sum of the
    three age-group counts over the sum of the three age-group universes, which is
    exact because the three groups partition the table.'
employment:
  intro:
  - The Americans with Disabilities Act (ADA) was written to secure equal opportunity
    and economic self-sufficiency for people with disabilities, and Title I of the
    Act specifically prohibits discrimination in employment.<sup>1</sup> More than
    three decades on, the gap in who holds a job remains one of the widest disparities
    in this data.
  - Nationally, <strong>43 percent</strong> of working-age people with disabilities
    are employed, compared with <strong>78 percent</strong> of working-age people
    without disabilities. Put another way, a person without a disability is close
    to <strong>twice as likely</strong> to be working.
  - This fact sheet shows the three employment situations the Census Bureau distinguishes
    for people aged 18 to 64. A person is <strong>employed</strong>, <strong>unemployed</strong>
    (not working but actively looking for work), or <strong>not in the labor force</strong>
    (neither working nor looking). Everyone is counted in exactly one of the three,
    so for each group the shares add to 100 percent.<sup>2</sup>
  - The largest difference is not in unemployment but in labor force participation.
    Just under half of working-age people with disabilities are in the labor force
    at all, against more than four in five people without disabilities. Barriers to
    getting and keeping a job, including inaccessible workplaces, transportation,
    benefit rules that penalize earnings, and outright discrimination, show up here
    rather than in the unemployment figure.
  employed_lead: The map below shows the share of working-age people with disabilities
    who are employed in each state. It is the headline measure on this sheet, and
    the spread across states is wide, from roughly a third of the age group in the
    lowest states to more than half in the highest.
  unemployed_lead: The share of <em>all</em> working-age people with disabilities
    who are unemployed, meaning not working but actively looking for work. Because
    the denominator is everyone in the age group rather than only those in the labor
    force, this figure is not the unemployment rate as it is usually reported. Both
    measures appear in the table further down, and they tell different stories.
  notlabor_lead:
  - The share of working-age people with disabilities who are neither working nor
    looking for work. This is the largest of the three categories for disabled people
    and the smallest for everyone else, which is the central finding of this sheet.
  - The category covers a range of situations, including study, caregiving, and retirement
    before 65, alongside people who have stopped looking after sustained difficulty
    finding work. It is shaded so that lower shares read as the more favorable outcome,
    on the reasoning that a person who wants to work should be able to. That framing
    will not fit every individual it counts.
  rates_table_lead:
  - The maps above measure each category against everyone aged 18 to 64. The table
    below reports the two figures that are more commonly quoted, and <strong>they
    use different denominators</strong>. The <strong>labor force participation rate</strong>
    is the share of the age group either working or looking. The <strong>unemployment
    rate</strong> is the share <em>of those in the labor force</em> who are not working,
    which is the definition the Bureau of Labor Statistics uses.
  - The distinction matters. Nationally the unemployment rate for people with disabilities
    is <strong>10.9 percent</strong> against <strong>4.8 percent</strong> for people
    without, a gap of roughly two to one. The share of all disabled working-age people
    who are unemployed is only 5.3 percent, because so many are not in the labor force
    to begin with. Neither figure is wrong; they answer different questions, and quoting
    one while meaning the other is the most common way this data gets misread.
  footnotes:
  - Americans With Disabilities Act of 1990. Pub. L. 101-336. &sect; 1 and Title I.
    26 July 1990. 104 Stat. 328.
  - 'U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Table ACSDT5Y{acs_year}.C18120, Employment Status by Disability Status. Universe:
    civilian noninstitutionalized population aged 18 to 64. Each share is calculated
    over the sum of the three C18120 categories for the same disability group, so
    the categories are mutually exclusive and sum to 100 percent.'
education:
  intro:
  - 'Education shapes almost everything that follows it: the work available to a person,
    what it pays, and how much choice they have about where and how they live. The
    gap in educational attainment between disabled and non-disabled adults is one
    of the widest in this data, and it opens early.'
  - Among adults aged 25 and over, <strong>17.0 percent</strong> of people with disabilities
    have not completed high school, against <strong>8.9 percent</strong> of people
    without. At the other end, <strong>20.9 percent</strong> hold a bachelor's degree
    or higher, against <strong>39.1 percent</strong>. On both measures the disparity
    is close to two to one, in opposite directions.<sup>1</sup>
  - 'A note on what these three measures do and do not cover. They are not a complete
    account of educational attainment. People whose highest qualification is some
    college without a degree, or an associate''s degree, are in none of the three,
    and they are a large group: <strong>29 percent</strong> of adults with disabilities
    and 28 percent of adults without. The three shares therefore add to between 63
    and 79 percent depending on the state, not to 100.<sup>2</sup>'
  - The final table on this sheet reports that remainder, so the full picture is visible
    rather than implied.
  no_hs_lead: The share of adults aged 25 and over with a disability whose formal
    education ended before a high school diploma or its equivalent. This is the clearest
    of the three measures, and the one most closely tied to later poverty and unemployment.
    It ranges from about 9 percent to 23 percent depending on the state.
  hs_lead:
  - The share whose highest qualification is a high school diploma or GED. This map
    is shaded by <strong>how large the share is</strong> rather than by performance,
    because the measure reads two ways at once. A high figure can mean a state gets
    more of its disabled residents through high school, and it can mean more of them
    stop there.
  - Read it against the two maps either side, which do carry a direction. A state
    with a large share here and a small share below high school is doing something
    different from a state with a large share here and a small share holding degrees.
  bachelors_lead: The share holding a bachelor's degree or a higher qualification.
    Nationally this is 20.9 percent of adults with disabilities against 39.1 percent
    of adults without, the single largest gap on the sheet. Higher education remains
    substantially harder to reach and to complete for disabled students, and the state
    variation reflects both school systems and the accessibility of public universities.
  remainder_table_lead:
  - Some college without a degree, and associate's degrees, fall outside all three
    measures above. This table reports that group directly, calculated as everything
    the three categories leave out.
  - It is a substantial share, <strong>29 percent</strong> of adults with disabilities
    nationally, and it matters for interpretation. A state with a low share holding
    bachelor's degrees is not necessarily a state where disabled adults stop at high
    school; many may hold an associate's degree or have attended college without finishing.
    This table makes that visible.
  footnotes:
  - 'U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Table ACSST5Y{acs_year}.S1811. Universe: the civilian noninstitutionalized population
    aged 25 and over. Shares are calculated against that population within each disability
    group.'
  - The three published categories are not exhaustive. Adults whose highest attainment
    is some college without a degree, or an associate's degree, are counted in none
    of them. The share in the final table is derived as 100 percent less the three
    published shares, so it is exact rather than estimated.
health_insurance:
  intro:
  - Health insurance is what makes health care reachable, and for people with disabilities
    it also pays for much of what makes community living possible, including personal
    care, equipment and long-term services and supports.
  - This fact sheet begins with a result that runs against expectation. Among working-age
    adults, people with disabilities are <strong>less</strong> likely to be uninsured
    than people without disabilities, <strong>9.9 percent</strong> against <strong>12.0
    percent</strong>.<sup>1</sup>
  - The reason is visible in the rest of the data. Public insurance, chiefly Medicaid
    and Medicare, covers <strong>51.8 percent</strong> of working-age people with
    disabilities, against <strong>15.0 percent</strong> of people without. Private
    coverage runs the other way, <strong>49.1 percent</strong> against <strong>76.1
    percent</strong>. Public programs are doing the work that employer-sponsored insurance
    does for everyone else.
  - That is worth stating plainly, because it is a policy achievement and also a dependency.
    Coverage that rests on public programs is coverage that moves when eligibility
    rules, waiver capacity or state budgets move. The state variation on the maps
    below is largely variation in how far each state has extended those programs.
  - One note on reading the figures. The four measures are not four slices of a whole.
    Public and private coverage <strong>overlap</strong>, because a person can hold
    both, so they add to more than the covered total.<sup>2</sup>
  none_19to64_lead: The share of working-age people with disabilities who have no
    health insurance of any kind. This is the clearest performance measure on the
    sheet, and the one where state policy choices show up most directly. It ranges
    from about 3 percent to nearly 20 percent depending on the state.
  public_19to64_lead: The share with Medicaid, Medicare or another public plan. This
    map is shaded by <strong>how large the share is</strong> rather than by performance,
    because a high figure carries two readings at once. It can mean a state has extended
    public coverage widely, and it can mean disabled residents are shut out of employer-sponsored
    insurance and have nowhere else to go. Read it alongside the uninsured map rather
    than on its own.
  private_19to64_lead: 'The share with private insurance, most often through an employer.
    This map is also shaded by size rather than performance, for the mirror-image
    reason: a high figure may reflect good access to jobs that carry benefits, and
    a low figure may reflect public programs successfully filling the gap. Note that
    people can hold private and public coverage at the same time, so this measure
    and the one above are not mutually exclusive.'
  covered_table_lead: Coverage is the exact complement of no coverage, so it is reported
    here rather than mapped a second time. The table gives both age groups side by
    side.
  age65_table_lead:
  - Nearly everyone aged 65 and over is insured, because Medicare is close to universal
    at that age. Coverage runs from <strong>98.5 to 99.9 percent</strong> across the
    states for people with disabilities, and the uninsured share from 0.1 to 1.5 percent.
  - That range is too narrow for state ranking to carry meaning, so these measures
    are shown as a table rather than as maps. Sorting states on a spread of about
    one percentage point would manufacture a difference that is not there. The figures
    that do vary at this age are the coverage types, where private insurance still
    reaches roughly half of older disabled adults as a supplement to Medicare.
  footnotes:
  - U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Table ACSDT5Y{acs_year}.B18135, Health Insurance Coverage Status by Disability
    Status. Shares for ages 19 to 64 are calculated against the civilian noninstitutionalized
    population with a disability in that age range; shares for age 65 and over against
    the corresponding population aged 65 and over.
  - Public and private coverage are not mutually exclusive in Table B18135. A person
    with both Medicare and a private supplemental plan is counted in each. For ages
    19 to 64 the two shares exceed the insured total by 7 to 14 percentage points,
    and for age 65 and over by 40 to 62 points, which is why the categories must not
    be read as parts of a whole.
commuting:
  intro:
  - Getting to work is a precondition for working. Transportation is one of the barriers
    people with disabilities name most often, and the Americans with Disabilities
    Act devotes a full title to it, requiring public transit systems to be accessible.<sup>1</sup>
  - This fact sheet has an unusual shape, and it is worth understanding before reading
    the maps. The Census question about commuting is asked only of <strong>people
    who work</strong>. Everything on the maps below therefore describes disabled workers,
    not disabled people generally.<sup>2</sup>
  - That distinction carries the sheet's most striking number. Only <strong>23 percent</strong>
    of people with disabilities are commuting workers, against <strong>51 percent</strong>
    of people without disabilities. Before any question about how people travel to
    work, there is a much larger question about who gets to work at all, and that
    is the subject of the <em>Employment</em> fact sheet.
  - Among those who do commute, the differences are modest. <strong>3.8 percent</strong>
    of disabled workers travel by public transit against 3.2 percent of other workers,
    and <strong>65.4 percent</strong> drive alone against 69.0 percent. The state-to-state
    variation on the maps is driven far more by whether a place has a transit system
    than by disability.
  - The two modes shown here do not add up to everything. Carpooling, walking, cycling,
    taxis and working from home make up the remainder, and together they account for
    between a fifth and a half of commutes depending on the state.
  transit_lead:
  - The share of workers with disabilities who travel to work by public transit. This
    map is shaded by <strong>how large the share is</strong> rather than by performance,
    because a high figure has two readings. It can mean a state has accessible transit
    that people can rely on, and it can mean workers have no alternative because they
    cannot drive or cannot afford a car.
  - Density explains most of what the map shows. The District of Columbia and New
    York are far above every other state; most states sit below 3 percent because
    they have little public transit for anyone to use, disabled or not.
  drivealone_lead:
  - The share of workers with disabilities who drive to work alone. This map is also
    shaded by size rather than performance, for the mirror-image reason. Driving alone
    can reflect independence and a vehicle adapted to a person's needs, and it can
    reflect the absence of any usable transit.
  - Workers with disabilities drive alone slightly less often than other workers,
    65.4 percent against 69.0 percent nationally, a smaller gap than most people expect.
  workers_table_lead:
  - 'The table below shows the figure that the maps cannot: what share of each population
    is in the commuting universe at all. This is the denominator behind every percentage
    on this sheet.'
  - Nationally it is <strong>23 percent</strong> of people with disabilities against
    <strong>51 percent</strong> of people without. A state with a low share is not
    necessarily doing badly on transportation; it may simply have fewer disabled residents
    in work. Read this table alongside the <em>Employment</em> fact sheet, which measures
    that directly.
  footnotes:
  - Americans With Disabilities Act of 1990. Pub. L. 101-336, Title II, Part B and
    Title III. 26 July 1990. 104 Stat. 328.
  - 'U.S. Census Bureau. American Community Survey 5-year estimates ({acs_start}&ndash;{acs_end}).
    Table ACSST5Y{acs_year}.S1811. Universe: workers aged 16 and over. Mode shares
    are calculated against the number of workers in each disability group, so they
    describe how workers travel, not how the whole population travels. The share of
    each population that is in this worker universe is reported in the final table.'
technology:
  intro:
  - Applying for a job, renewing a benefit, joining a class, refilling a prescription
    and seeing a doctor have all moved online over the past decade. A household without
    a computer or a connection is not merely inconvenienced by that shift. It is cut
    out of services that no longer have an offline route, and the exclusion lands
    hardest on people who already face the most barriers to reaching those services
    in person.
  - <strong>72.8 percent</strong> of people with disabilities live in a household
    with a laptop or desktop computer, against <strong>86.2 percent</strong> of people
    without disabilities. <strong>89.6 percent</strong> have an internet subscription,
    against 96.6 percent, and <strong>85.2 percent</strong> have a smartphone, against
    95.2 percent.<sup>1</sup> The computer gap is the widest of the three at 13.4
    points, and behind that percentage sit <strong>11.7 million people with disabilities
    living in a household with no computer at all</strong>.
  - The three measures are not three versions of one thing, and the sheet is worth
    reading as a whole rather than one map at a time. In fifty of the fifty one states
    and the District of Columbia, more people with disabilities have a smartphone
    than have a computer, and nationally the difference is 12.4 points. In Mississippi
    it is 22.8 points, where 60.8 percent have a computer and 83.6 percent have a
    smartphone. A phone is enough to read a message and not enough to complete a long
    benefits application, prepare a resume or sit a course, so a state that looks
    well served on the smartphone map may still be leaving people without the tool
    the task actually requires.
  - One note on where these figures come from. Technology access is measured from
    the American Community Survey Public Use Microdata Sample rather than from the
    published summary tables behind the other fact sheets, because the three questions
    are asked once per household and have to be tabulated from the person records
    to describe people. The population here is therefore people with disabilities
    living in occupied housing units, and all three measures rest on that one shared
    base.<sup>2</sup> Anyone living in a nursing home, a group home, a correctional
    facility or other group quarters is outside it, excluded from the count and the
    base alike. That makes this sheet's population narrower than the one used on <em>Living
    in Community</em> and <em>Living in Institution</em>, which count everyone.
  computer_lead: The share of people with disabilities living in a household with
    a laptop or desktop computer. This is the widest of the three disability gaps
    and also the measure on which the states differ most, a spread of 23.4 points
    from Mississippi at 60.8 percent to Utah at 84.2 percent. It is the measure most
    closely tied to what a person can actually do online, since form filling, job
    applications and coursework are difficult or impossible on a phone.
  internet_lead: The share living in a household with an internet subscription of
    any kind, whether the household pays for it or not. Access is higher here than
    for either device and the states differ least, a spread of 11.2 points. Read it
    as a floor rather than a ceiling. The survey asks whether a household has a subscription,
    not how fast it is, how reliable it is or what share of the household budget it
    takes, so a household counted here may still have a connection too slow for a
    video appointment.<sup>3</sup>
  smartphone_lead: The share living in a household with a smartphone. This is the
    measure on which people with disabilities come closest to everyone else, and it
    should be read against the computer map rather than on its own. Where the two
    diverge sharply the phone is standing in for a computer rather than adding to
    one, and a substitute is not an equivalent. Vermont is the single exception in
    the other direction, the one state where computer access runs slightly ahead of
    smartphone access.
  combined_table_lead: The maps above sort the states into four performance groups
    one measure at a time, which means a single state's three figures never appear
    together. The table below puts them side by side in alphabetical order. It is
    the quickest way to find the states that do well on one measure and badly on another,
    which is where the substitution described above is happening.<sup>4</sup>
  footnotes:
  - 'U.S. Census Bureau. American Community Survey 5-year Public Use Microdata Sample
    ({pums_start} to {pums_year}), variables LAPTOP, ACCESSINET and SMARTPHONE. Tabulated
    by ADA-PARC from the person-level microdata using person weights (PWGTP), because
    the published figure is a statement about people rather than about households.
    Universe: people in occupied housing units, by disability status (DIS). Residents
    of group quarters are excluded from both the count and the base.'
  - All three questions are asked of the same households, so the three measures share
    one denominator in every state by construction. That identity is asserted as a
    test when the data is built, and an extract that violates it fails rather than
    publishes. Internet access counts a subscription of any kind, paid or provided
    free. Computer access counts laptops and desktops together.
  - The Census Bureau suppressed the internet response for a small number of households
    in selected areas for the 2024 data year. Those households are removed from all
    three measures rather than from internet alone, so that the shared denominator
    holds. They are 792 households in Pennsylvania, 0.23 percent of that state's base,
    and no households anywhere else.
  - These are sample estimates and carry sampling error. Margins of error are computed
    by successive difference replication at the 90 percent confidence level and are
    published with the data rather than printed on the maps, which would be unreadable.
    Across states the margin on the disability percentage has a median of 0.6 points
    for computer, 0.5 for internet and 0.5 for smartphone, and never exceeds 2.0 points.
    Differences between states of less than about one point should not be read as
    real.

